<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="manifest" href="/manifest.webmanifest?v=2" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none;
        -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    :root { --cyan:#70e6ff; --blue:#438cff; --ink:rgba(5,10,18,.78); --edge:rgba(112,230,255,.24);
            --controls-bottom:max(22px,env(safe-area-inset-bottom));
            --spell-bar-bottom:var(--controls-bottom);
            --spell-slot-size:64px; --spell-slot-gap:8px;
            --chat-bottom:calc(var(--controls-bottom) + 115px); }
    html,body { width:100%; height:100%; overflow:hidden; background:#080d14; color:#fff;
                font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif; touch-action:auto; }
    canvas { display:block; width:100%; height:100%; }
    #world-overlay { position:fixed; inset:0; pointer-events:none; z-index:12; }
    #arena-ui { position:fixed; inset:0; z-index:35; pointer-events:none; }
    .arena-atlas-icon { display:inline-block; width:1em; aspect-ratio:1; flex:none;
                        vertical-align:middle; background-repeat:no-repeat; }
    .arena-item-tooltip { --tooltip-width:min(252px,calc(100vw - 24px));
                          --tooltip-left:calc(var(--tooltip-anchor-x) + 14px);
                          position:fixed; width:var(--tooltip-width); padding:10px 11px 9px;
                          left:clamp(12px,var(--tooltip-left),calc(100vw - 12px - var(--tooltip-width)));
                          transform:translateY(-50%); pointer-events:auto; color:#deecf7;
                          background:linear-gradient(165deg,rgba(9,18,30,.97),rgba(3,8,15,.98));
                          border:1px solid rgba(112,230,255,.34); border-radius:8px;
                          box-shadow:0 14px 34px rgba(0,0,0,.46),inset 0 0 22px rgba(80,180,230,.05);
                          font:12px/1.25 ui-monospace,SFMono-Regular,monospace; }
    .arena-item-tooltip[data-side="left"] { --tooltip-left:calc(var(--tooltip-anchor-x) - 14px - var(--tooltip-width)); }
    .arena-item-tooltip[data-mining] { --tooltip-width:min(142px,40vw);
                                      --tooltip-left:calc(var(--tooltip-anchor-x) + 49px); }
    .arena-item-tooltip[data-mining][data-side="left"] {
      --tooltip-left:calc(var(--tooltip-anchor-x) - 49px - var(--tooltip-width));
    }
    .arena-item-tooltip[data-mining] .arena-item-tooltip-rarity,
    .arena-item-tooltip[data-mining] .arena-item-tooltip-rows { display:none; }
    .arena-item-tooltip[data-mining] .arena-item-tooltip-action { margin-top:6px; }
    .arena-item-tooltip-header { display:flex; align-items:center; gap:9px; padding-bottom:8px;
                                 border-bottom:1px solid rgba(255,255,255,.1); }
    .arena-item-tooltip-icon { flex:none; }
    .arena-item-tooltip-icon > .arena-atlas-icon { display:block; width:34px; border-radius:4px; }
    .arena-item-tooltip-title { min-width:0; font-weight:900; letter-spacing:.03em; }
    .arena-item-tooltip-title > div:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .arena-item-tooltip-rarity { margin-top:3px; font-size:9px; letter-spacing:.12em; opacity:.78; }
    .arena-item-tooltip-rows { display:grid; gap:4px; padding:8px 0 6px; }
    .arena-item-tooltip-row { display:grid; grid-template-columns:1fr auto 16px; gap:4px; color:rgba(222,234,247,.8); }
    .arena-item-tooltip-row strong { color:#f6f9ff; font-weight:800; }
    .arena-item-tooltip-effect { display:flex; align-items:baseline; color:#b8e6b8; }
    .arena-item-tooltip-effect > span:first-child { color:#d9ffd9; font-weight:800; }
    .arena-item-tooltip-effect strong { color:inherit; font-weight:inherit; }
    .arena-item-tooltip-effect .arena-item-tooltip-change { margin-left:auto; }
    .arena-item-tooltip-change { font-weight:900; text-align:right; }
    .arena-item-tooltip-change.up { color:#6ff08c; }
    .arena-item-tooltip-change.down { color:#ff7777; }
    .arena-item-tooltip-action { width:100%; padding:5px 6px; border:1px solid rgba(112,230,255,.28);
                                 border-radius:5px; color:rgba(190,230,245,.75); background:rgba(20,65,88,.28);
                                 font:700 9px ui-monospace,monospace; letter-spacing:.05em; cursor:pointer; }
    .arena-item-tooltip-action:hover { color:#fff; border-color:#70e6ff; background:rgba(40,120,160,.35); }
    #entry-gate { position:fixed; inset:0; z-index:100; display:grid; place-items:center; overflow:auto;
                  background:radial-gradient(circle at 50% 45%,rgba(18,55,76,.9),rgba(3,7,12,.98)); }
    #entry-card { width:min(390px,calc(100vw - 34px)); padding:28px; text-align:center;
                  background:linear-gradient(165deg,rgba(13,29,44,.98),rgba(5,10,18,.98));
                  border:1px solid rgba(112,230,255,.34); border-radius:16px;
                  box-shadow:0 24px 80px rgba(0,0,0,.58),inset 0 0 35px rgba(60,180,230,.05); }
    #entry-card h1 { font-size:23px; letter-spacing:.16em; color:#e9fbff; text-shadow:0 0 18px rgba(112,230,255,.62); }
    #entry-card p { margin:10px 0 20px; color:rgba(210,228,242,.62); font-size:13px; }
    #entry-status { margin:-8px 0 16px; color:#8af0ff; font:700 12px/1.4 ui-monospace,monospace; }
    #entry-status[data-state="signed-out"], #entry-status[data-state="join-failed"] { color:#ffd58a; }
    #entry-status[data-state="offline"] { color:rgba(210,228,242,.58); }
    #entry-balance { display:block; margin:0 0 14px; padding:9px; border:1px solid var(--edge);
                     border-radius:8px; color:#f1dfaa; font:13px/1.5 system-ui,sans-serif; }
    #entry-balance[hidden] { display:none; }
    #entry-inventory { display:block; margin:0 0 12px; padding:8px 0; color:#8af0ff; font-size:13px; }
    #entry-inventory[hidden] { display:none; }
    #camp-controls { position:fixed; z-index:51; inset:24% 0 auto; text-align:center; pointer-events:none; }
    #camp-controls button { pointer-events:auto; min-height:44px; padding:6px 12px; margin:2px;
                            color:#dff8ff; background:#101f2b; border:1px solid #5796ad; border-radius:7px;
                            font:700 13px system-ui,sans-serif; cursor:pointer; touch-action:manipulation; }
    #camp-controls button[data-anchored] {
      --prompt-width:152px; --prompt-top:64px; --prompt-bottom:54px;
      position:fixed; width:var(--prompt-width); margin:0; transform:translateX(-50%);
      left:clamp(calc(var(--prompt-width) / 2 + max(8px,env(safe-area-inset-left))),var(--prompt-x),
                 calc(100% - var(--prompt-width) / 2 - max(8px,env(safe-area-inset-right))));
      top:clamp(max(var(--prompt-top),env(safe-area-inset-top)),var(--prompt-y),
                calc(100% - max(var(--prompt-bottom),env(safe-area-inset-bottom) + 44px)));
    }
    #camp-controls[data-paired] button[data-anchored] { --prompt-bottom:106px; }
    #camp-controls[data-paired] button[data-below] { --prompt-top:116px; --prompt-bottom:54px; }
    #camp-controls button:disabled { opacity:.65; }
    #camp-status { display:block; width:fit-content; margin:3px auto 0; padding:4px 8px;
                   border-radius:6px; background:#09131e; color:#dff8ff; font:13px/1.4 system-ui,sans-serif; }
    #camp-status:empty { display:none; }
    #camp-status[data-confirmed] { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    #player-name { width:100%; padding:12px 14px; color:#fff; background:rgba(1,6,12,.72);
                   border:1px solid rgba(112,230,255,.3); border-radius:8px; outline:none;
                   font:700 16px ui-monospace,monospace; text-align:center; user-select:text; }
    #player-name:focus { border-color:#70e6ff; box-shadow:0 0 18px rgba(112,230,255,.14); }
    #enter-dungeon { width:100%; margin-top:12px; padding:12px; border:1px solid rgba(112,230,255,.55);
                     border-radius:8px; color:#061019; background:linear-gradient(135deg,#8af0ff,#5da8ff);
                     font-weight:900; letter-spacing:.1em; cursor:pointer; }
    #install-arena { width:100%; margin-top:10px; padding:10px; border:1px solid var(--edge);
                     border-radius:8px; color:#dcecf7; background:transparent; cursor:pointer; }
    #hud { position:fixed; top:max(10px,env(safe-area-inset-top)); left:max(10px,env(safe-area-inset-left));
           right:max(10px,env(safe-area-inset-right)); max-width:1100px; margin:0 auto;
           display:flex; flex-direction:column; gap:4px; z-index:40; }
    .hud-top-bar { display:grid; grid-template-columns:auto repeat(3,minmax(0,1fr)) minmax(0,auto) auto;
                   align-items:center; gap:9px; min-height:42px; padding:6px 9px;
                   font-size:12px; color:rgba(224,240,255,.78); text-align:center;
                   background:linear-gradient(180deg,rgba(11,22,36,.88),rgba(5,10,18,.72));
                   border:1px solid var(--edge); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.28); }
    .brand { color:#e9fbff; font-weight:900; letter-spacing:.14em; text-shadow:0 0 12px rgba(112,230,255,.55); }
    .hud-resource { position:relative; min-width:0; height:25px; overflow:hidden; border-radius:999px;
                    background:linear-gradient(180deg,rgba(3,6,13,.86),rgba(19,24,35,.92));
                    border:1px solid rgba(255,255,255,.19); box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
                    display:flex; align-items:center; justify-content:center; }
    .hud-resource-fill { position:absolute; inset:0 auto 0 0; width:0%; border-radius:999px 0 0 999px;
                         transition:width 220ms ease-out,filter 180ms ease-out,box-shadow 180ms ease-out; }
    .hud-resource-recent { position:absolute; inset:0 auto 0 0; width:0%; border-radius:0 999px 999px 0;
                           background:rgba(255,255,255,.92); opacity:0; pointer-events:none;
                           box-shadow:0 0 12px rgba(255,255,255,.75); mix-blend-mode:screen; }
    .hud-resource-value { position:relative; z-index:1; color:#fff8ea; font-weight:900;
                          display:flex; align-items:center; gap:4px;
                          font-variant-numeric:tabular-nums; text-shadow:0 1px 2px #000; white-space:nowrap; }
    .hud-resource-value > .arena-atlas-icon, .hud-meta .arena-atlas-icon { width:16px; border-radius:3px; }
    .hud-resource[data-resource="health"] .hud-resource-fill { background:linear-gradient(90deg,#c71942,#ff4164 58%,#ff6b7f); }
    .hud-resource[data-resource="mana"] .hud-resource-fill { background:linear-gradient(90deg,#1d68c5,#4aa3ff 58%,#72c2ff); }
    .hud-resource[data-resource="stamina"] .hud-resource-fill { background:linear-gradient(90deg,#8d520e,#c38222 58%,#ecb44d); }
    .hud-resource[data-resource="health"] .hud-resource-recent { background:linear-gradient(90deg,rgba(255,112,132,.95),rgba(255,235,212,.98)); }
    .hud-resource[data-resource="mana"] .hud-resource-recent { background:linear-gradient(90deg,rgba(106,198,255,.95),rgba(226,250,255,.98)); }
    .hud-resource[data-resource="stamina"] .hud-resource-recent { background:linear-gradient(90deg,#ffc36b,#fff1bd); }
    .hud-resource.resource-draining { animation:resource-drain-flash .56s ease-out; }
    .hud-resource[data-state="critical"] .hud-resource-fill { filter:saturate(1.35); animation:resource-critical .7s ease-in-out infinite alternate; }
    .hud-resource.mana-boosted { border-color:rgba(100,210,255,.75); animation:mana-surge .8s ease-in-out infinite alternate; }
    @keyframes resource-critical { to { opacity:.72; filter:saturate(1.5) brightness(1.25); } }
    @keyframes resource-drain-flash { 0% { filter:brightness(1.5); } 100% { filter:brightness(1); } }
    @keyframes mana-surge { to { box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 16px rgba(75,175,255,.42); } }
    .hud-meta { max-width:min(240px,22vw); color:rgba(203,220,235,.48); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #hud-conditions { display:flex; flex-wrap:wrap; gap:4px; align-self:flex-start; max-width:100%; }
    #hud-conditions[hidden] { display:none; }
    .hud-condition-badge { position:relative; display:flex; align-items:center; justify-content:center;
                           flex:none; width:var(--spell-slot-size); height:var(--spell-slot-size); overflow:hidden;
                           background:rgba(5,10,18,.9); border:1px solid var(--edge); border-radius:5px;
                           color:#fff8ea; font:700 9px/1 ui-monospace,monospace; text-shadow:0 1px 2px #000; }
    .arena-condition-icon { width:100%; aspect-ratio:1; background-repeat:no-repeat; }
    .hud-condition-name, .hud-condition-time { position:absolute; white-space:nowrap; }
    .hud-condition-name { inset:auto 0 0; padding:3px 2px 2px; text-align:center;
                          font:700 8px/1 system-ui,sans-serif;
                          overflow:hidden; text-overflow:ellipsis; background:linear-gradient(transparent,#050a12 60%); }
    .hud-condition-time { top:1px; right:1px; padding:1px 2px; border-radius:3px; background:rgba(5,10,18,.88);
                          font-variant-numeric:tabular-nums; }
    #hud-materials { position:absolute; top:calc(100% + 5px); left:0;
                     max-width:min(380px, 50vw); padding:6px 8px; background:rgba(5,10,18,.86);
                     color:#f1dfaa; border:1px solid var(--edge); border-radius:6px; font:12px/1.4 system-ui,sans-serif; }

    /* ── Joysticks ── */
    .joystick { position:fixed; bottom:max(22px,env(safe-area-inset-bottom)); width:112px; height:112px; border-radius:50%;
                background:radial-gradient(circle,rgba(112,230,255,.08),rgba(5,10,18,.28));
                border:1px solid rgba(112,230,255,.24); box-shadow:inset 0 0 24px rgba(30,110,170,.1); z-index:20; }
    .joystick-left  { left:max(18px,env(safe-area-inset-left)); }
    .joystick-right { right:max(18px,env(safe-area-inset-right)); }
    .joystick-knob  { position:absolute; width:44px; height:44px; border-radius:50%;
                      background:rgba(112,230,255,.18); border:1px solid rgba(160,240,255,.5);
                      box-shadow:0 0 16px rgba(70,190,255,.18);
                      top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
    .joystick-right .joystick-knob { background:rgba(255,165,94,.16); border-color:rgba(255,188,120,.52); }
    .touch-dot { position:fixed; width:18px; height:18px; margin-left:-9px; margin-top:-9px;
                 border-radius:50%; pointer-events:none; display:none; z-index:30; }
    .touch-dot-left  { background:rgba(120,220,255,0.9); box-shadow:0 0 0 3px rgba(120,220,255,0.25); }
    .touch-dot-right { background:rgba(255,170,110,0.95); box-shadow:0 0 0 3px rgba(255,170,110,0.25); }
    .stick-readout { display:none; }
    #readout-left  { left:24px; }
    #readout-right { right:24px; text-align:right; }

    /* ── Spell bar ── */
    #spell-controls { position:fixed; bottom:var(--spell-bar-bottom); left:50%; transform:translateX(-50%);
                      width:max-content; z-index:50; pointer-events:none; }
    #spell-bar { display:flex; flex-wrap:wrap; justify-content:center; gap:var(--spell-slot-gap); }
    #cast-bar, #zoom-readout { position:absolute; left:50%; bottom:calc(100% + 10px); transform:translateX(-50%); }
    #cast-bar { width:min(180px,60vw); padding:5px 8px; border:1px solid var(--edge);
                border-radius:6px; background:var(--ink); pointer-events:none;
                font:700 11px/1.2 ui-monospace,monospace; text-align:center; color:#e8f1fa; }
    #cast-bar:not([hidden]) { display:grid; gap:4px; }
    #cast-bar progress { width:100%; height:6px; accent-color:#ecc56d; }
    #cast-bar:not([hidden]) ~ #zoom-readout { visibility:hidden; }
    .spell-btn { --spell-accent:#e9bc78; --icon-brightness:1.22;
                 position:relative; flex:none; width:var(--spell-slot-size); height:var(--spell-slot-size); border-radius:10px;
                 background:var(--ink); border:2px solid color-mix(in srgb,var(--spell-accent) 52%,#19212b);
                 text-align:center; pointer-events:auto;
                 cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.3); transition:border-color .15s,transform .15s; }
    .spell-btn[data-element="frost"] { --spell-accent:#74d7ff; }
    .spell-btn[data-element="electric"] { --spell-accent:#b4a2ff; }
    .spell-btn[data-element="poison"] { --spell-accent:#b6df63; }
    .spell-btn[data-element="nature"] { --spell-accent:#66d5a0; }
    .spell-btn[data-element="shadow"] { --spell-accent:#d29bff; }
    .spell-btn > .arena-atlas-icon { position:absolute; inset:0; width:100%; height:100%;
                                    border-radius:7px; filter:brightness(var(--icon-brightness)) saturate(1.35); }
    .spell-btn.active { --icon-brightness:1.4; z-index:1; border-color:var(--spell-accent);
                        transform:translateY(-3px); box-shadow:0 0 14px color-mix(in srgb,var(--spell-accent) 45%,transparent); }
    .spell-btn .spell-name { position:absolute; inset:auto 0 6px; color:#fff0db; font-size:10px; font-weight:800;
                             line-height:1; text-shadow:0 1px 3px #000; }
    .spell-btn.resource-low { opacity:.52; }
    .spell-btn.charging::before { content:''; position:absolute; inset:auto 4px 2px; height:3px;
      z-index:1; pointer-events:none; border-radius:2px;
      background:linear-gradient(to right,var(--spell-accent) calc(var(--charge,0) * 100%),rgba(0,0,0,.75) 0); }
    .spell-btn.cooldown:not(.charging) { --icon-brightness:.66; }
    .spell-btn.cooldown::after { content:attr(data-cooldown); position:absolute; inset:0; display:grid; place-items:center;
                                 color:#fff; font-size:11px; line-height:1; text-shadow:0 1px 3px #000; }
    .spell-btn .spell-key { position:absolute; top:3px; right:3px; padding:1px 2px; border-radius:3px;
                            background:rgba(3,8,14,.82); color:#dce6ee; font-size:10px; line-height:1; }
    .spell-btn .spell-ammo { position:absolute; right:4px; bottom:3px; min-width:14px;
                             padding:1px 3px; border-radius:5px; background:rgba(3,8,14,.86);
                             color:#f5dfad; font-size:10px; font-weight:900; line-height:1.1;
                             font-variant-numeric:tabular-nums; }
    .spell-btn .spell-ammo.empty { color:#ff8c8c; }
    #zoom-readout { white-space:nowrap; pointer-events:auto; opacity:.45; transition:opacity .2s; }
    #zoom-readout:hover { opacity:1; }
    #reset-dungeon { padding:7px 10px; white-space:nowrap;
                     border:1px solid rgba(126,232,194,.28); border-radius:6px; background:rgba(5,15,20,.76);
                     color:rgba(220,255,242,.82); font:11px ui-monospace,monospace; letter-spacing:.04em;
                     cursor:pointer; }
    #reset-dungeon:hover { background:rgba(22,58,58,.9); color:#fff; }
    #dungeon-chat { position:fixed; left:max(12px,env(safe-area-inset-left));
                    bottom:var(--chat-bottom);
                    width:min(320px,calc(100vw - 24px)); z-index:55; pointer-events:none;
                    font:13px/1.4 system-ui,sans-serif; color:#e6f1f7; }
    #dungeon-chat[data-composing] { bottom:max(var(--chat-bottom),calc(var(--keyboard-inset,0px) + 10px)); }
    #dungeon-chat, #dungeon-chat * { touch-action:auto; }
    #dungeon-chat button, #chat-message { border:1px solid var(--edge); border-radius:6px; min-height:35px;
                                        background:#0c1721; color:#effaff; }
    #dungeon-chat button { padding:0 10px; cursor:pointer; pointer-events:auto; }
    #dungeon-chat button:focus-visible, #chat-message:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
    #chat-feed { list-style:none; max-height:min(116px,18dvh); overflow:auto; overscroll-behavior:contain;
                 touch-action:pan-y; margin-bottom:6px; pointer-events:auto; }
    #chat-feed:empty, #chat-status:empty { display:none; }
    #chat-feed li { background:rgba(5,10,18,.82); padding:4px 8px; border-radius:5px; margin:2px 0;
                   overflow-wrap:anywhere; }
    #chat-feed bdi { font-weight:700; color:#a7e9f8; }
    #chat-form { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:5px; align-items:center;
                 margin-top:5px; padding:6px; background:#071019; border:1px solid var(--edge); border-radius:8px;
                 pointer-events:auto; }
    #chat-form[hidden] { display:none; }
    #chat-form label { color:#a7e9f8; font:12px ui-monospace,monospace; }
    #chat-message { width:100%; padding:4px 7px; font:16px system-ui,sans-serif; user-select:text; -webkit-user-select:text; }
    #chat-status { grid-column:1 / -1; color:#ffcb94; font-size:12px; }

    @media (max-width:920px) {

<script>
  const ENABLE_SW = true;
  let arenaStarted = false;
  const entryGate = document.getElementById('entry-gate');
  const entryStatus = document.getElementById('entry-status');
  const entryButton = document.getElementById('enter-dungeon');
  const installButton = document.getElementById('install-arena');
  let installPrompt;

  window.addEventListener('beforeinstallprompt', (event) => {
    if (!entryGate.isConnected) return;
    event.preventDefault();
    installPrompt = event;
    installButton.hidden = false;
  });

  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installButton.hidden = true;
  });

  installButton.addEventListener('click', async () => {
    if (!installPrompt) return;
    const prompt = installPrompt;
    installPrompt = null;
    installButton.hidden = true;
    try {
      await prompt.prompt();
    } catch (error) {
      console.warn('Arena install prompt failed', error);
    }
  });

  function showArenaLoadError(message) {
    if (!entryGate.isConnected) document.body.append(entryGate);
    entryStatus.textContent = message;
    entryStatus.dataset.state = 'signed-out';
    entryButton.type = 'button';
    entryButton.disabled = false;
    entryButton.textContent = 'Reload Arena';
    entryButton.onclick = () => {
      const url = new URL(location.href);
      url.searchParams.set('retry', String(Date.now()));
      location.replace(url);
    };
  }

  window.addEventListener('error', (event) => {
    if (!arenaStarted && (event.target?.id === 'arena-boot' || event instanceof ErrorEvent)) {
      showArenaLoadError('The arena could not load. Reload to try again.');
    }
  }, true);
  window.addEventListener('unhandledrejection', () => {
    if (!arenaStarted) showArenaLoadError('The arena could not start. Reload to try again.');
  });
  document.getElementById('game').addEventListener('webglcontextlost', () => {
    showArenaLoadError('The graphics connection was lost. Reload to try again.');
  });

  async function registerServiceWorker() {
    const isGithubPages = window.location.hostname.endsWith('github.io');
    if (isGithubPages) {
      if ('serviceWorker' in navigator) {
        try { const regs = await navigator.serviceWorker.getRegistrations(); for (const reg of regs) await reg.unregister(); }
        catch (err) { console.warn('SW unregister on github.io failed', err); }
      }
      return;
    }
    if (!ENABLE_SW || !('serviceWorker' in navigator) || !window.isSecureContext) return;
    try {
      const reg = await navigator.serviceWorker.register(new URL('sw.js', location.href).pathname, {
        scope: new URL('.', location.href).pathname, updateViaCache: 'none',
      });
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const ins = reg.installing; if (!ins) return;
        ins.addEventListener('statechange', () => {
          if (ins.state === 'installed' && navigator.serviceWorker.controller) ins.postMessage({ type: 'SKIP_WAITING' });
        });
      });
    } catch (err) {
      if (err?.name !== 'AbortError') console.warn('SW registration failed', err);
    }
  }
  window.addEventListener('load', () => registerServiceWorker());
</script>

<script type="module" id="arena-boot">
// ── Boot: imports ───────────────────────────────────────────────
import { generateArenaCave } from './src/rules/geometry/caveGen.js';
import { findReachableNear } from './src/rules/geometry/landmarks.js';
import { resolveSeed } from './src/runtime/rng.js';
import { getPreviewMob, previewMobNames, spawnPreviewMob } from './src/runtime/mobPreview.js';
import { getItemPreview, givePreviewItems } from './src/runtime/itemPreview.js';
import { spawnEpicChest } from './src/rules/spawner.js';
import { createFixedTickLoop } from './src/runtime/fixedLoop.js';
import { createInputRouter } from './src/input/InputRouter.js';
import { createCamera } from './src/display/camera/controller.js';
import { createCameraSystem } from './src/display/camera/system.js';
import { createGridCarver } from './src/rules/geometry/carve.js';
import { ParticleFX } from './src/display/webgl/particles.js';
import { createWebGLArenaRenderer } from './src/display/webgl/arenaRenderer.js';
import { createDungeonDecorations } from './src/display/worldDecorations.js';
import { createSnapshotInterpolator } from './src/display/snapshotInterpolator.js';
import { createLocalPlayerPrediction } from './src/display/localPlayerPrediction.js';
import { createProjectileFxController } from './src/display/passes/projectileFx.js';
import { createArenaAudio, unlockArenaAudio } from './src/display/audio/arenaAudio.js';
import { createAtlasIcon } from './src/display/ui/atlasIcon.js';
import { createItemTooltip } from './src/display/ui/itemTooltip.js';
import { createDungeonChat } from './src/display/ui/dungeonChat.js';
import { createResourceBar } from './src/display/ui/resourceBars.js';
import { spellCastProgress } from './src/display/spellCastProgress.js';
import { ArrowAmmo, BowWeapon, Gold, Health, Mana, MaterialStacks, MeleeWeapon, Mining, Powerups, Spellbook, Position, Stamina } from './src/rules/components/index.js';
import { CampAction, checkCampAction, inCampReach } from './src/rules/camp.js';
import { getMiningMaterial } from './src/rules/data/miningMaterials.js';
import { MINING_SECONDS } from './src/rules/components/Mining.js';
import { createNetClient } from './src/net/client.js';
import { normalizePlayerName } from './src/shared/net/protocol.js';
import { samplePlayerCommand } from './src/input/samplePlayerCommand.js';
import { SIM_MODE, SIM_TICK_HZ } from './src/rules/sim/arenaSim.js';
import { createArenaDungeonSimulation } from './src/rules/sim/arenaDungeon.js';
import { spells as spellCatalog, TargetingType } from './src/rules/data/spellCatalog.js';
import { isSelectedUnitCandidate } from './src/rules/systems/playerCombatSystem.js';

// ── Canvas + DOM ────────────────────────────────────────────────
const canvas = document.getElementById('game');
const overlayCanvas = document.getElementById('world-overlay');

const pageParams = new URLSearchParams(location.search);
const itemPreview = getItemPreview(pageParams);
const previewName = pageParams.get('spawn');
const chestPreview = pageParams.get('chest')?.trim().toLowerCase() === 'epic';
const mobPreview = chestPreview ? null : getPreviewMob(previewName);
const isPreview = Boolean(mobPreview || chestPreview);
const forceOffline = pageParams.has('offline') || previewName !== null || chestPreview || itemPreview !== null;
const tracksOfflineProgress = forceOffline && previewName === null && !chestPreview && !itemPreview;
const offlineProgressKey = 'hack-arena.offline-progress';
let offlineProgress = { gold: 0 };
if (tracksOfflineProgress) {
  try {
    const saved = JSON.parse(localStorage.getItem(offlineProgressKey));
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
      const gold = Number.isSafeInteger(saved.gold) && saved.gold >= 0 ? saved.gold : 0;
      offlineProgress = { ...saved, gold };
    }
  } catch (error) {
    console.warn('Could not load offline progress', error);
  }
}
const resetDungeonButton = document.getElementById('reset-dungeon');
resetDungeonButton.hidden = !forceOffline;
document.getElementById('reset-dungeon').addEventListener('click', () => {
  if (!forceOffline) return;
  if (!window.confirm('Leave this dungeon and generate a new one?')) return;
  const next = new URL(location.href);
  const values = new Uint32Array(1);
  crypto.getRandomValues(values);
  next.searchParams.set('seed', String(values[0] || Date.now()));
  location.assign(next);
});
const authState = forceOffline ? null : await fetch('/auth/me', { credentials: 'same-origin', cache: 'no-store' })
  .then(async (response) => response.ok ? response.json() : ({ authenticated: false }))
  .catch(() => ({ authenticated: false, unavailable: true }));

const entryBalance = document.getElementById('entry-balance');
if (tracksOfflineProgress || authState?.authenticated) {
  const inventory = document.getElementById('entry-inventory');
  const inventoryUrl = new URL('/interface-preview/?view=inventory', location.href);
  if (pageParams.has('room')) inventoryUrl.searchParams.set('room', pageParams.get('room'));
  if (tracksOfflineProgress) inventoryUrl.searchParams.set('offline', '');
  inventory.href = inventoryUrl.href;
  inventory.hidden = false;
}
function showBalance({ gold, materials }) {
  const banked = Object.entries(materials ?? {}).flatMap(([id, count]) => {
    const item = getMiningMaterial(id);
    return item && Number.isSafeInteger(count) && count > 0 ? [`${count} ${item.name}`] : [];
  });
  entryBalance.textContent = `${gold.toLocaleString()} Gold · ${banked.length ? `Banked ${banked.join(', ')}` : 'Bank is empty'}`;
  entryBalance.hidden = false;
}
if (tracksOfflineProgress) showBalance(offlineProgress);
if (authState?.authenticated) {
  const balanceUrl = new URL('/api/character', location.href);
  if (pageParams.has('room')) balanceUrl.searchParams.set('room', pageParams.get('room'));
  fetch(balanceUrl, { cache: 'no-store' }).then(async (response) => {
    if (!response.ok) throw new Error('Could not load character balance');
    showBalance(await response.json());
  }).catch(() => {
    entryBalance.textContent = 'Bank balance unavailable. Reload to try again.';
    entryBalance.hidden = false;
  });
}

let dungeonChat = null;
let onCampResult = () => {};
let stopOnDisconnect = (message) => showArenaLoadError(`${message} Reload to return to the main screen.`);
const netClient = createNetClient({
  roomId: pageParams.get('room') ?? undefined,
  onSay(message) { dungeonChat?.receive(message); },
  onSayError(message) { dungeonChat?.reject(message); },
  onCampResult(message) { onCampResult(message); },
  onDisconnect(message) {
    stopOnDisconnect(message);
  },
});
const { playerName, netWelcome } = await new Promise((resolve) => {
  const form = document.getElementById('entry-card');
  const field = document.getElementById('player-name');
  const status = document.getElementById('entry-status');
  if (forceOffline) {
    status.dataset.state = 'offline';
    if (itemPreview) status.textContent = itemPreview.status;
    else if (chestPreview) status.textContent = 'OFFLINE CHEST PREVIEW · EPIC';
    else if (mobPreview) status.textContent = `OFFLINE MOB PREVIEW · ${previewName.trim().toUpperCase()}`;
    else if (previewName !== null) status.textContent = `Unknown mob. Available previews: ${previewMobNames}.`;
    else status.textContent = 'OFFLINE MODE';
  } else if (authState.authenticated) {
    status.dataset.state = 'signed-in';
    status.textContent = 'SIGNED IN';
  } else {
    status.dataset.state = 'signed-out';
    status.textContent = authState.unavailable ? 'SIGN-IN STATUS UNAVAILABLE' : 'NOT SIGNED IN · ENTER TO SIGN IN';
  }
  field.value = localStorage.getItem('hack-arena.player-name') || '';
  entryButton.disabled = false;
  requestAnimationFrame(() => field.focus());
  async function enterDungeon(event) {
    event.preventDefault();
    if (entryButton.disabled) return;
    if (!forceOffline && !authState.authenticated) {
      window.location.assign(`/auth/login?return=${encodeURIComponent(location.pathname + location.search)}`);
      return;
    }
    // Unlock Web Audio while this is still a browser user gesture.
    unlockArenaAudio();
    const name = normalizePlayerName(field.value);
    localStorage.setItem('hack-arena.player-name', name);
    entryButton.disabled = true;
    status.dataset.state = 'loading';
    status.textContent = forceOffline ? 'Loading dungeon…' : 'Joining the shared dungeon…';
    const welcome = forceOffline ? null : await netClient.connect(name);
    if (!forceOffline && !welcome) {
      status.dataset.state = 'join-failed';
      status.textContent = netClient.getStatusText();
      authState.authenticated = !netClient.needsSignIn();
      entryButton.textContent = authState.authenticated ? 'Try Again' : 'Sign In Again';
      entryButton.disabled = false;
      return;
    }
    status.textContent = 'Loading dungeon…';
    form.removeEventListener('submit', enterDungeon);
    resolve({ playerName: name, netWelcome: welcome });
  }
  form.addEventListener('submit', enterDungeon);
});

const isNetworked = Boolean(netWelcome);

// ── Seed + cave ─────────────────────────────────────────────────
const SEED = netWelcome?.seed ?? (chestPreview && !pageParams.get('seed') ? 7 : resolveSeed().seed);
const caveData = generateArenaCave(SEED);
const { grid, bounds, spawns, routes, campfires } = caveData;
const camp = isNetworked || tracksOfflineProgress ? caveData.camp : null;
const spawn = spawns[0];
const previewChestSite = chestPreview ? findReachableNear(grid, spawn, [72, 56, 40]) : null;
const decorations = createDungeonDecorations({ grid, routes, spawns, campfires, seed: SEED });

const carve = createGridCarver(grid);

// ── Particle FX ─────────────────────────────────────────────────
const cam = createCamera();
cam.x = cam.targetX = spawn.x;
cam.y = cam.targetY = spawn.y;
const previewWidth = mobPreview === getPreviewMob('backline') ? 370
  : mobPreview === getPreviewMob('wraith') ? 340 : 0;
cam.scale = cam.targetScale = previewWidth ? Math.min(1.8, window.innerWidth / previewWidth) : 1.8;

const fx = new ParticleFX({ capacity: 2048, seedBase: SEED });

// ── Input ───────────────────────────────────────────────────────
const inputRouter = createInputRouter({
  leftBase:    document.getElementById('joystick-left'),
  leftKnob:    document.getElementById('knob-left'),
  leftMarker:  document.getElementById('touch-left'),
  rightBase:   document.getElementById('joystick-right'),
  rightKnob:   document.getElementById('knob-right'),
  rightMarker: document.getElementById('touch-right'),
  canvas,
  getUnitSpell(slot, cycle) {
    const book = world.get(playerId, Spellbook);
    if (!book?.spells.length) return null;
    const count = book.spells.length;
    const step = isNetworked ? Math.sign(pendingSpellCycle + cycle) : cycle;
    const activeSlot = slot ?? pendingSpellSlot ?? (book.activeIndex + step % count + count) % count;
    const spell = spellCatalog[book.spells[activeSlot]];
    return spell?.targeting.type === TargetingType.SELECTED_UNIT ? spell : null;
  },
  pickUnit(spell, x, y) {
    const id = renderer?.pickUnit(x, y, (id) => isSelectedUnitCandidate(world, spell, id));
    return id == null ? null : sim.getActorNetworkId(id);
  },
});

// ── Spell bar (touch) ───────────────────────────────────────────
// Spell bar — intercept touches BEFORE InputRouter claims them
const spellBar = document.getElementById('spell-bar');
const castBar = document.getElementById('cast-bar');
const [castName, castMeter] = castBar.children;

function syncCastBar(book) {
  const mining = world.get(playerId, Mining);
  const timedSpell = book?.castPhase === 'casting' || book?.castPhase === 'channeling'
    ? spellCatalog[book.spells[book.chargeSpellIndex]] : null;
  const name = mining ? 'Mining' : timedSpell?.name;
  castBar.hidden = !name || Boolean(world.get(playerId, Health)?.dead);
  if (castBar.hidden) return;
  if (castName.textContent !== name) castName.textContent = name;
  castMeter.value = mining ? 1 - mining.remaining / MINING_SECONDS : spellCastProgress(book, timedSpell);
}

function selectSpellSlot(e) {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.target.closest('.spell-btn');
  if (!btn) return;
  const slot = Number(btn.dataset.slot);
  inputRouter.setSpellSlot(slot);
  spellBar.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
spellBar.addEventListener('touchstart', selectSpellSlot, { capture: true });
spellBar.addEventListener('pointerdown', selectSpellSlot);

// ── ECS world ───────────────────────────────────────────────────
const sim = createArenaDungeonSimulation({
  seed: SEED,
  cave: caveData,
  mode: isNetworked ? SIM_MODE.REPLICA : SIM_MODE.AUTHORITY,
  preview: isPreview,
});
let renderer = null;
let pendingInteraction = null;
let pendingSpellSlot = null;
let pendingSpellCycle = 0;
sim.world.on('terrain.carved', (event) => {
  carve(event.x, event.y, event.radius);
  renderer?.terrainChanged();
});
if (isNetworked && netWelcome.snapshot) sim.applySnapshot(netWelcome.snapshot);
const playerId = isNetworked
  ? (sim.getPlayerEntity(netWelcome.peerId) ?? sim.addPlayer(netWelcome.peerId, 0, null, playerName))
  : sim.addPlayer('local', 0, null, playerName);
const world = sim.world;
if (isNetworked) {
  dungeonChat = createDungeonChat({
    root: document.getElementById('dungeon-chat'),
    localPeerId: netWelcome.peerId,
    playerForPeer: sim.getPlayerEntity,
    send: netClient.say,
    onCompose(open) {
      inputRouter.setSuspended(open);
      if (open) {
        pendingInteraction = null;
        pendingSpellSlot = null;
        pendingSpellCycle = 0;
      }
    },
  });
}
if (mobPreview) spawnPreviewMob(world, grid, world.get(playerId, Position), mobPreview);
if (previewChestSite) spawnEpicChest(world, previewChestSite.x, previewChestSite.y);
if (itemPreview) givePreviewItems(world, grid, playerId, itemPreview.items);
if (tracksOfflineProgress) {
  world.get(playerId, Gold).count = offlineProgress.gold;
}
const interpolation = isNetworked
  ? createSnapshotInterpolator({ sim, intervalMs: 1000 / (netWelcome.snapshotHz || 10) })
  : null;
const localPrediction = isNetworked
  ? createLocalPlayerPrediction({ world, playerId, grid })
  : null;
const presentation = isNetworked ? {
  lootHeight: interpolation.lootHeight,
  position(entityId, position) {
    return entityId === playerId
      ? localPrediction.position()
      : interpolation.position(entityId, position);
  },
} : null;
const runtimeEvents = { casts: 0 };
const initialPlayerPosition = world.get(playerId, Position);
cam.x = cam.targetX = initialPlayerPosition.x;
cam.y = cam.targetY = initialPlayerPosition.y;

// ── Client-only camera ──────────────────────────────────────────
const cameraSystem = createCameraSystem({
  cam,
  playerId,
  positionFor: presentation?.position,
});

// ── Dynamic spell bar (rebuild when spells change) ───────────────
let shownSpells = [];
function syncSpellSlots(book) {
  if (book.spells.length === shownSpells.length && book.spells.every((id, i) => id === shownSpells[i])) return;
  shownSpells = [...book.spells];
  spellBar.replaceChildren();
  book.spells.forEach((spellId, i) => {
    const spell = spellCatalog[spellId];
    if (!spell) return;
    const btn = document.createElement('div');
    btn.className = 'spell-btn' + (i === book.activeIndex ? ' active' : '');
    btn.dataset.slot = i;
    const costText = spell.staminaCost
      ? `${spell.staminaCost} stamina`
      : spell.ammoType === 'arrow'
      ? 'consumes arrows'
      : spell.mana.perTick != null ? `${spell.mana.perTick} mana/tick` : `${spell.mana.cost || 0} mana`;
    btn.dataset.element = spell.element;
    btn.title = `${spell.name} · ${costText} · ${spell.description ?? spell.cast.mode.replace('_', ' ')}`;
    const iconId = spellId === 'poison_orb' ? 'venom_orb' : spellId === 'curse_of_agony' ? 'cursed' : spellId;
    const icon = createAtlasIcon(iconId, spell.name);
    if (icon) btn.append(icon);
    const key = document.createElement('span');
    key.className = 'spell-key';
    key.textContent = String(i + 1);
    btn.append(key);
    if (spell.ammoType === 'arrow') {
      const ammo = document.createElement('span');
      ammo.className = 'spell-ammo';
      btn.append(ammo);
    }
    if (spell.staminaCost || !icon) {
      const name = document.createElement('span');
      name.className = 'spell-name';
      name.textContent = spell.name;
      btn.appendChild(name);
    }
    spellBar.appendChild(btn);
  });
}

const projectileFx = createProjectileFxController({ world, fx, runtimeEvents });
const arenaAudio = createArenaAudio({
  world,
  getPlayerPosition() {
    const position = world.get(playerId, Position);
    return presentation?.position(playerId, position) ?? position;
  },
});

// ── Renderer ────────────────────────────────────────────────────
const itemTooltip = createItemTooltip({
  root: document.getElementById('arena-ui'),
  onActivate(target) { if (!dungeonChat?.isComposing()) pendingInteraction = target; },
});
const healthBar = createResourceBar(document.getElementById('hud-hp-bar'), { key: 'health', label: '♥', color: '#ff4164' });
const manaBar = createResourceBar(document.getElementById('hud-mana-bar'), { key: 'mana', label: '◆', color: '#55aaff', boostedClass: 'mana-boosted' });
const staminaBar = createResourceBar(document.getElementById('hud-stamina-bar'), { key: 'stamina', label: 'Stamina', color: '#ecb44d' });
function syncHudResources() {
  const health = world.get(playerId, Health);
  const mana = world.get(playerId, Mana);
  const stamina = world.get(playerId, Stamina);
  const powerups = world.get(playerId, Powerups);
  healthBar.set(health?.hp ?? 0, health?.maxHp ?? 1);
  manaBar.set(mana?.mana ?? 0, mana?.maxMana ?? 1, {
    boosted: (powerups?.manaRegenSeconds || 0) > 0,
  });
  staminaBar.set(stamina?.stamina ?? 0, stamina?.maxStamina ?? Stamina.defaults.maxStamina);
}
syncHudResources();
renderer = createWebGLArenaRenderer({
  canvas, overlayCanvas, cam, grid, bounds, decorations, fx, world, SEED, runtimeEvents,
  camp,
  getMineableOre: sim.getMineableOre,
  net: isNetworked ? netClient : null, playerId,
  presentation,
  speechBubbles: () => dungeonChat?.getBubbles(),
  stepParticles: projectileFx.step,
  itemTooltip,
  resourceBars: { health: healthBar, mana: manaBar },
  hud: {
    hud:         document.getElementById('hud'),
    hp:          document.getElementById('hud-hp'),
    weapon:      document.getElementById('hud-weapon'),
    mana:        document.getElementById('hud-mana'),
    meta:        document.getElementById('hud-meta'),
    conditions:  document.getElementById('hud-conditions'),
    materials:   document.getElementById('hud-materials'),
    readL:       document.getElementById('readout-left'),
    readR:       document.getElementById('readout-right'),
    zoomReadout: document.getElementById('zoom-readout'),
  },
  input: {
    leftStick:  inputRouter,
    rightStick: inputRouter,
    keyboardInput: () => {
      const o = inputRouter.getOutput();
      return { mx: o.intent.moveX, my: o.intent.moveY };
    },
  },
});

const campControls = document.getElementById('camp-controls');
const depositButton = document.getElementById('camp-deposit');
const exitButton = document.getElementById('camp-exit');
const campStatus = document.getElementById('camp-status');
let campRequest = null;
let campStatusTimer;

function showCampStatus(message) {
  delete campStatus.dataset.confirmed;
  campStatus.textContent = message;
  clearTimeout(campStatusTimer);
  if (message) campStatusTimer = setTimeout(() => { campStatus.textContent = ''; }, 4500);
}

function syncCampControls() {
  if (!camp) return;
  const position = world.get(playerId, Position);
  const health = world.get(playerId, Health);
  const dead = health.dead || health.hp <= 0;
  depositButton.hidden = dead || !inCampReach(grid, position, camp.bank);
  exitButton.hidden = !dead && !inCampReach(grid, position, camp.portal);
  const exitLabel = dead ? 'Return to main screen' : 'Take exit portal';
  if (exitButton.textContent !== exitLabel) exitButton.textContent = exitLabel;
  depositButton.disabled = exitButton.disabled = campRequest !== null;
  campControls.hidden = depositButton.hidden && exitButton.hidden && !campStatus.textContent;

  const bankPoint = depositButton.hidden ? null : renderer.worldToClient(camp.bank);
  const portalPoint = exitButton.hidden || dead ? null : renderer.worldToClient(camp.portal);
  const paired = Boolean(bankPoint && portalPoint);
  campControls.toggleAttribute('data-paired', paired);
  positionCampPrompt(depositButton, bankPoint, paired && bankPoint.y > portalPoint.y);
  positionCampPrompt(exitButton, portalPoint, paired && portalPoint.y >= bankPoint.y);
}

function positionCampPrompt(button, point, below) {
  button.toggleAttribute('data-anchored', Boolean(point));
  button.toggleAttribute('data-below', below);
  if (!point) return;
  button.style.setProperty('--prompt-x', `${Math.round(point.x)}px`);
  button.style.setProperty('--prompt-y', `${Math.round(point.y + (below ? 38 : -62))}px`);
}

onCampResult = ({ action, error, deposited }) => {
  campRequest = null;
  if (error) {
    showCampStatus(error);
  } else if (action === CampAction.EXIT) {
    loop.stop();
    netClient.destroy();
    location.reload();
  } else if (action === CampAction.DEPOSIT) {
    const total = Object.values(deposited).reduce((sum, count) => sum + count, 0);
    const message = `Banked ${total} ${total === 1 ? 'material' : 'materials'}`;
    renderer.showCampDeposit(message);
    showCampStatus(message);
    campStatus.dataset.confirmed = '';
  }
};

function requestCampAction(action) {
  if (campRequest !== null) return;
  if (isNetworked) {
    if (netClient.campAction(action)) {
      campRequest = action;
      if (action === CampAction.DEPOSIT) showCampStatus('Saving deposit…');
    } else {
      showCampStatus('Connection lost. Reload to return to the main screen.');
    }
    return;
  }
  const error = checkCampAction({ world, player: playerId, grid, camp, action });
  if (error || action === CampAction.EXIT) {
    onCampResult({ action, error });
    return;
  }
  const stacks = world.get(playerId, MaterialStacks);
  const deposited = stacks.counts;
  const materials = { ...offlineProgress.materials };
  for (const [id, count] of Object.entries(deposited)) materials[id] = (materials[id] ?? 0) + count;
  const updated = { ...offlineProgress, materials };
  try {
    localStorage.setItem(offlineProgressKey, JSON.stringify(updated));
  } catch (error) {
    console.warn('Could not save offline bank', error);
    showCampStatus('Could not save your deposit. Try again.');
    return;
  }
  offlineProgress = updated;
  stacks.counts = {};
  onCampResult({ action, deposited });
}

depositButton.addEventListener('click', () => requestCampAction(CampAction.DEPOSIT));
exitButton.addEventListener('click', () => requestCampAction(CampAction.EXIT));

// ── Game loop (fixed tick + render) ─────────────────────────────
const ZOOM_MIN = 0.3, ZOOM_MAX = 6.0, ZOOM_STEP = 0.15;
let netTick = 0;

const loop = createFixedTickLoop({
  tickHz: SIM_TICK_HZ,
  simulate(dt) {
    // Sample input ONCE per tick — systems read via getOutput()
    const o = inputRouter.sample();
    if (o.pickupPressed) itemTooltip.activate();
    if (o.zoomDelta) {
      cam.targetScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, cam.targetScale + o.zoomDelta * ZOOM_STEP));
    }
    if (isNetworked) {
      // The network client is intentionally send-rate limited. Keep discrete
      // spell selections queued until an input frame actually carries them.
      if (o.spellSlot != null) pendingSpellSlot = o.spellSlot;
      if (o.spellCycle) pendingSpellCycle += o.spellCycle;
      const snapshot = netClient.getLatestSnapshot();
      if (snapshot && interpolation.applySnapshot(snapshot)) localPrediction.reconcile();
      localPrediction.step(o, dt);
    } else {
      const command = samplePlayerCommand(o, ++netTick);
      if (pendingInteraction) {
        command.pickupX = pendingInteraction.x;
        command.pickupY = pendingInteraction.y;
        command.mine = pendingInteraction.mine;
        pendingInteraction = null;
      }
      sim.setPlayerInput('local', command);
      inputRouter.consumeFirePress();
      sim.step(dt);
      const gold = world.get(playerId, Gold).count;
      if (tracksOfflineProgress && gold !== offlineProgress.gold) {
        offlineProgress = { ...offlineProgress, gold };
        try {
          localStorage.setItem(offlineProgressKey, JSON.stringify(offlineProgress));
        } catch (error) {
          console.warn('Could not save offline progress', error);
        }
      }
    }
    cameraSystem(world, dt);
    const networkInput = isNetworked
      ? { ...o, spellSlot: pendingSpellSlot, spellCycle: pendingSpellSlot == null ? Math.sign(pendingSpellCycle) : 0 }
      : o;
    if (isNetworked && netClient.update(++netTick, networkInput, pendingInteraction)) {
      inputRouter.consumeFirePress();
      pendingInteraction = null;
      pendingSpellSlot = null;
      pendingSpellCycle = 0;
    }
  },
  render() {
    // Keep the DOM HUD independent from the WebGL pass. A renderer error or
    // a delayed first frame must not leave resource bars at their placeholders.
    syncHudResources();
    renderer.renderFrame();
    syncCampControls();
    const sb = world.get(playerId, Spellbook);
    arenaAudio.updateLocalCast(sb);
    syncCastBar(sb);
    // Sync spell bar UI with active spell
    if (sb) {
      syncSpellSlots(sb);
      const stamina = world.get(playerId, Stamina)?.stamina ?? 0;
      spellBar.querySelectorAll('.spell-btn').forEach((b) => {
        const i = Number(b.dataset.slot);
        b.classList.toggle('active', i === sb.activeIndex);
        const charging = sb.charging && i === sb.chargeSpellIndex;
        b.classList.toggle('charging', charging);
        const spell = spellCatalog[sb.spells[i]];
        b.classList.toggle('resource-low', stamina < (spell?.staminaCost ?? 0));
        const remainingCooldown = Math.max(sb.cooldown || 0, sb.cooldowns?.[sb.spells[i]] || 0);
        b.classList.toggle('cooldown', remainingCooldown > 0);
        b.dataset.cooldown = remainingCooldown > 0 ? remainingCooldown.toFixed(1) : '';
        const ammoBadge = b.querySelector('.spell-ammo');
        if (ammoBadge) {
          const bow = world.get(playerId, BowWeapon);
          const ammo = world.get(playerId, ArrowAmmo);
          const infinite = Boolean(bow?.equipped && bow.infiniteArrows);
          const arrowCount = ammo?.count ?? 0;
          ammoBadge.textContent = infinite ? '∞' : String(arrowCount);
          ammoBadge.classList.toggle('empty', !infinite && arrowCount === 0);
        }
        b.style.setProperty('--charge', charging ? spellCastProgress(sb, spell) : 0);
      });
    }
    if (!arenaStarted) {
      arenaStarted = true;
      entryGate.remove();
    }
  },
});

stopOnDisconnect = (message) => {
  loop.stop();
  showArenaLoadError(`${message} Reload to return to the main screen.`);
};
loop.start();
console.log(`Cave: seed=${SEED.toString(16)} grid=${grid.cols}x${grid.rows} spawns=${spawns.length}`);

addEventListener('beforeunload', () => {
  loop.stop();
  inputRouter.destroy();
  dungeonChat?.dispose();
  netClient.destroy();
  arenaAudio.dispose();
  renderer.dispose();
});
</script>
</body>
</html>
