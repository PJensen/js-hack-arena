<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hack Arena</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none;
        -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    :root { --cyan:#70e6ff; --blue:#438cff; --ink:rgba(5,10,18,.78); --edge:rgba(112,230,255,.24); }
    html,body { width:100%; height:100%; overflow:hidden; background:#080d14; color:#fff;
                font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif; }
    canvas { display:block; width:100%; height:100%; }
    #world-overlay { position:fixed; inset:0; pointer-events:none; z-index:12; }
    #entry-gate { position:fixed; inset:0; z-index:100; display:grid; place-items:center;
                  background:radial-gradient(circle at 50% 45%,rgba(18,55,76,.9),rgba(3,7,12,.98)); }
    #entry-card { width:min(390px,calc(100vw - 34px)); padding:28px; text-align:center;
                  background:linear-gradient(165deg,rgba(13,29,44,.98),rgba(5,10,18,.98));
                  border:1px solid rgba(112,230,255,.34); border-radius:16px;
                  box-shadow:0 24px 80px rgba(0,0,0,.58),inset 0 0 35px rgba(60,180,230,.05); }
    #entry-card h1 { font-size:23px; letter-spacing:.16em; color:#e9fbff; text-shadow:0 0 18px rgba(112,230,255,.62); }
    #entry-card p { margin:10px 0 20px; color:rgba(210,228,242,.62); font-size:13px; }
    #player-name { width:100%; padding:12px 14px; color:#fff; background:rgba(1,6,12,.72);
                   border:1px solid rgba(112,230,255,.3); border-radius:8px; outline:none;
                   font:700 16px ui-monospace,monospace; text-align:center; user-select:text; }
    #player-name:focus { border-color:#70e6ff; box-shadow:0 0 18px rgba(112,230,255,.14); }
    #enter-dungeon { width:100%; margin-top:12px; padding:12px; border:1px solid rgba(112,230,255,.55);
                     border-radius:8px; color:#061019; background:linear-gradient(135deg,#8af0ff,#5da8ff);
                     font-weight:900; letter-spacing:.1em; cursor:pointer; }
    #hud { position:fixed; top:max(12px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
           display:flex; align-items:center; gap:10px; min-height:38px; padding:7px 12px;
           font-size:12px; color:rgba(224,240,255,.78); text-align:center; z-index:40;
           background:linear-gradient(180deg,rgba(11,22,36,.88),rgba(5,10,18,.72));
           border:1px solid var(--edge); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.28); }
    .brand { color:#e9fbff; font-weight:900; letter-spacing:.14em; text-shadow:0 0 12px rgba(112,230,255,.55); }
    .hud-stat { padding:3px 7px; border-radius:5px; font-weight:700; font-variant-numeric:tabular-nums; }
    .hud-stat.hp { color:#70ef8d; background:rgba(40,190,83,.1); }
    .hud-stat.mana { color:#72adff; background:rgba(67,140,255,.12); }
    .hud-stat.mana.boosted { color:#c9f4ff; border:1px solid rgba(100,210,255,.55); animation:surge-pulse .8s ease-in-out infinite alternate; }
    @keyframes surge-pulse { to { background:rgba(67,140,255,.32); box-shadow:0 0 14px rgba(75,175,255,.38); } }
    .hud-meta { color:rgba(203,220,235,.48); }

    /* ── Joysticks ── */
    .joystick { position:fixed; bottom:max(22px,env(safe-area-inset-bottom)); width:112px; height:112px; border-radius:50%;
                background:radial-gradient(circle,rgba(112,230,255,.08),rgba(5,10,18,.28));
                border:1px solid rgba(112,230,255,.24); box-shadow:inset 0 0 24px rgba(30,110,170,.1); z-index:20; }
    .joystick-left  { left:max(18px,env(safe-area-inset-left)); }
    .joystick-right { right:max(18px,env(safe-area-inset-right)); }
    .joystick-knob  { position:absolute; width:44px; height:44px; border-radius:50%;
                      background:rgba(112,230,255,.18); border:1px solid rgba(160,240,255,.5);
                      box-shadow:0 0 16px rgba(70,190,255,.18);
                      top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
    .joystick-right .joystick-knob { background:rgba(255,165,94,.16); border-color:rgba(255,188,120,.52); }
    .touch-dot { position:fixed; width:18px; height:18px; margin-left:-9px; margin-top:-9px;
                 border-radius:50%; pointer-events:none; display:none; z-index:30; }
    .touch-dot-left  { background:rgba(120,220,255,0.9); box-shadow:0 0 0 3px rgba(120,220,255,0.25); }
    .touch-dot-right { background:rgba(255,170,110,0.95); box-shadow:0 0 0 3px rgba(255,170,110,0.25); }
    .stick-readout { display:none; }
    #readout-left  { left:24px; }
    #readout-right { right:24px; text-align:right; }

    /* ── Spell bar ── */
    #spell-bar { position:fixed; bottom:max(22px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
                 display:flex; gap:8px; z-index:50; pointer-events:auto; }
    .spell-btn { width:48px; height:48px; border-radius:10px;
                 background:var(--ink); border:1px solid rgba(255,255,255,.18);
                 color:#fff; font-size:22px; line-height:48px; text-align:center;
                 cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.3); transition:border-color .15s,background .15s,transform .15s; }
    .spell-btn.active { border-color:var(--cyan); background:rgba(52,133,180,.28); transform:translateY(-3px); box-shadow:0 0 18px rgba(80,210,255,.22); }
    .spell-btn.charging { border-color:#d9fbff; background:conic-gradient(from -90deg,var(--cyan) calc(var(--charge,0) * 1turn),rgba(16,37,54,.88) 0); }
    .spell-btn .spell-key { display:block; font-size:10px; line-height:1;
                            color:rgba(255,255,255,0.4); margin-top:-8px; }
    #zoom-readout { opacity:.45; transition:opacity .2s; }
    #zoom-readout:hover { opacity:1; }
    .player-dead .joystick, .player-dead #spell-bar { opacity:.2; filter:grayscale(1); pointer-events:none; }
    @media (max-width:620px) {
      #hud { max-width:calc(100vw - 20px); gap:6px; padding:6px 8px; }
      .hud-meta { display:none; }
      .joystick { width:104px; height:104px; }
      #zoom-readout { display:none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="world-overlay"></canvas>
  <div id="entry-gate">
    <form id="entry-card">
      <h1>HACK//ARENA</h1>
      <p>Choose the name that will follow you into the deep.</p>
      <input id="player-name" maxlength="20" autocomplete="nickname" placeholder="Adventurer" aria-label="Player name" />
      <button id="enter-dungeon" type="submit">ENTER THE DUNGEON</button>
    </form>
  </div>
  <div id="hud">
    <span class="brand">HACK//ARENA</span>
    <span class="hud-stat hp" id="hud-hp">♥ —</span>
    <span class="hud-stat mana" id="hud-mana">◆ —</span>
    <span class="hud-meta" id="hud-meta">connecting</span>
  </div>
  <div id="zoom-readout" style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    font:13px ui-monospace,monospace;color:rgba(255,255,255,0.5);z-index:40;
    background:rgba(0,0,0,0.4);padding:4px 12px;border-radius:6px;
    border:1px solid rgba(255,255,255,0.1)">zoom: —</div>
  <div class="stick-readout" id="readout-left">L stick idle</div>
  <div class="stick-readout" id="readout-right">R stick idle</div>
  <div class="joystick joystick-left" id="joystick-left"><div class="joystick-knob" id="knob-left"></div></div>
  <div class="joystick joystick-right" id="joystick-right"><div class="joystick-knob" id="knob-right"></div></div>
  <div class="touch-dot touch-dot-left" id="touch-left"></div>
  <div class="touch-dot touch-dot-right" id="touch-right"></div>
  <div id="spell-bar">
    <div class="spell-btn active" data-slot="0">&#x2744;<span class="spell-key">1</span></div>
    <div class="spell-btn" data-slot="1">&#x26A1;<span class="spell-key">2</span></div>
  </div>

<script>
  const ENABLE_SW = true;

  async function registerServiceWorker() {
    const isGithubPages = window.location.hostname.endsWith('github.io');
    if (isGithubPages) {
      if ('serviceWorker' in navigator) {
        try { const regs = await navigator.serviceWorker.getRegistrations(); for (const reg of regs) await reg.unregister(); }
        catch (err) { console.warn('SW unregister on github.io failed', err); }
      }
      return;
    }
    if (!ENABLE_SW || !('serviceWorker' in navigator) || !window.isSecureContext) return;
    try {
      const reg = await navigator.serviceWorker.register(new URL('sw.js', location.href).pathname, {
        scope: new URL('.', location.href).pathname, updateViaCache: 'none',
      });
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const ins = reg.installing; if (!ins) return;
        ins.addEventListener('statechange', () => {
          if (ins.state === 'installed' && navigator.serviceWorker.controller) ins.postMessage({ type: 'SKIP_WAITING' });
        });
      });
    } catch (err) {
      if (err?.name !== 'AbortError') console.warn('SW registration failed', err);
    }
  }
  window.addEventListener('load', () => registerServiceWorker());
</script>

<script type="module">
// ── Boot: imports ───────────────────────────────────────────────
import { generateCave, CaveProfile } from './src/rules/geometry/caveGen.js';
import { resolveSeed } from './src/runtime/rng.js';
import { createFixedTickLoop } from './src/runtime/fixedLoop.js';
import { createInputRouter } from './src/input/InputRouter.js';
import { createCamera } from './src/display/camera/controller.js';
import { createCameraSystem } from './src/display/camera/system.js';
import { createGridCarver } from './src/rules/geometry/carve.js';
import { ParticleFX } from './src/display/webgl/particles.js';
import { createWebGLArenaRenderer } from './src/display/webgl/arenaRenderer.js';
import { createDungeonDecorations } from './src/display/worldDecorations.js';
import { createSnapshotInterpolator } from './src/display/snapshotInterpolator.js';
import { createLocalPlayerPrediction } from './src/display/localPlayerPrediction.js';
import { createProjectileFxController } from './src/display/passes/projectileFx.js';
import { Spellbook, Position } from './src/rules/components/index.js';
import { createNetClient } from './src/net/client.js';
import { samplePlayerCommand } from './src/input/samplePlayerCommand.js';
import { SIM_MODE, SIM_TICK_HZ, createArenaSimulation } from './src/rules/sim/arenaSim.js';

// ── Canvas + DOM ────────────────────────────────────────────────
const canvas = document.getElementById('game');
const overlayCanvas = document.getElementById('world-overlay');

const playerName = await new Promise((resolve) => {
  const gate = document.getElementById('entry-gate');
  const form = document.getElementById('entry-card');
  const field = document.getElementById('player-name');
  field.value = localStorage.getItem('hack-arena.player-name') || '';
  requestAnimationFrame(() => field.focus());
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = field.value.replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Adventurer';
    localStorage.setItem('hack-arena.player-name', name);
    gate.remove();
    resolve(name);
  }, { once: true });
});

// -- Ultra-basic multiplayer location sync ----------------------
const pageParams = new URLSearchParams(location.search);
const roomId = pageParams.get('room') || 'lobby';
const forceOffline = pageParams.has('offline');
const netClient = createNetClient({
  roomId,
  playerName,
});
const netWelcome = forceOffline ? null : await netClient.connect();
const isNetworked = Boolean(netWelcome);

// ── Seed + cave ─────────────────────────────────────────────────
const SEED = netWelcome?.seed ?? resolveSeed().seed;
const caveData = generateCave({ seed: SEED, width: 4000, height: 4000, profile: CaveProfile.CAVERNS, spawnCount: 8, spawnSpacing: 650 });
const { grid, bounds, spawns, routes } = caveData;
const spawn = spawns[0];
const decorations = createDungeonDecorations({ grid, routes, spawns, seed: SEED });

const carve = createGridCarver(grid);

// ── Particle FX ─────────────────────────────────────────────────
const cam = createCamera();
cam.x = cam.targetX = spawn.x;
cam.y = cam.targetY = spawn.y;
cam.scale = cam.targetScale = 1.8;

const fx = new ParticleFX({ capacity: 2048, seedBase: SEED });

// ── Input ───────────────────────────────────────────────────────
const inputRouter = createInputRouter({
  leftBase:    document.getElementById('joystick-left'),
  leftKnob:    document.getElementById('knob-left'),
  leftMarker:  document.getElementById('touch-left'),
  rightBase:   document.getElementById('joystick-right'),
  rightKnob:   document.getElementById('knob-right'),
  rightMarker: document.getElementById('touch-right'),
  canvas,
});

// ── Spell bar (touch) ───────────────────────────────────────────
// Spell bar — intercept touches BEFORE InputRouter claims them
const spellBar = document.getElementById('spell-bar');
spellBar.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.target.closest('.spell-btn');
  if (!btn) return;
  const slot = Number(btn.dataset.slot);
  inputRouter._setSpellSlot(slot);
  spellBar.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}, { capture: true });
spellBar.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.target.closest('.spell-btn');
  if (!btn) return;
  const slot = Number(btn.dataset.slot);
  inputRouter._setSpellSlot(slot);
  spellBar.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

// ── ECS world ───────────────────────────────────────────────────
const sim = createArenaSimulation({
  seed: SEED,
  grid,
  spawns,
  mode: isNetworked ? SIM_MODE.REPLICA : SIM_MODE.AUTHORITY,
  enemyCount: 3,
});
let renderer = null;
sim.world.on('terrain.carved', (event) => {
  carve(event.x, event.y, event.radius);
  renderer?.terrainChanged();
});
if (isNetworked && netWelcome.snapshot) sim.applySnapshot(netWelcome.snapshot);
const playerId = isNetworked
  ? (sim.getPlayerEntity(netWelcome.peerId) ?? sim.addPlayer(netWelcome.peerId, 0, null, playerName))
  : sim.addPlayer('local', 0, null, playerName);
const world = sim.world;
const interpolation = isNetworked
  ? createSnapshotInterpolator({ sim, intervalMs: 1000 / (netWelcome.snapshotHz || 10) })
  : null;
const localPrediction = isNetworked
  ? createLocalPlayerPrediction({ world, playerId, grid })
  : null;
const presentation = isNetworked ? {
  position(entityId, position) {
    return entityId === playerId
      ? localPrediction.position()
      : interpolation.position(entityId, position);
  },
} : null;
const runtimeEvents = { casts: 0 };
const initialPlayerPosition = world.get(playerId, Position);
cam.x = cam.targetX = initialPlayerPosition.x;
cam.y = cam.targetY = initialPlayerPosition.y;

// ── Client-only camera ──────────────────────────────────────────
const cameraSystem = createCameraSystem({
  cam,
  playerId,
  positionFor: presentation?.position,
});

// ── Dynamic spell bar (rebuild when spells change) ───────────────
import { spells as spellCatalog } from './src/rules/data/spellCatalog.js';
function rebuildSpellBar() {
  if (!world.has(playerId, Spellbook)) return;
  const book = world.get(playerId, Spellbook);
  const bar = document.getElementById('spell-bar');
  bar.innerHTML = '';
  book.spells.forEach((spellId, i) => {
    const spell = spellCatalog[spellId];
    if (!spell) return;
    const btn = document.createElement('div');
    btn.className = 'spell-btn' + (i === book.activeIndex ? ' active' : '');
    btn.dataset.slot = i;
    btn.title = `${spell.name} · ${spell.manaCost || 0} mana · hold to charge`;
    btn.innerHTML = spell.glyph + '<span class="spell-key">' + (i + 1) + '</span>';
    bar.appendChild(btn);
  });
  // Re-bind touch
  bar.querySelectorAll('.spell-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault(); e.stopPropagation();
      inputRouter._setSpellSlot(Number(btn.dataset.slot));
    }, { capture: true });
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      inputRouter._setSpellSlot(Number(btn.dataset.slot));
    });
  });
}
world.on('item.pickup', () => rebuildSpellBar());
rebuildSpellBar();

const projectileFx = createProjectileFxController({ world, fx, runtimeEvents });

// ── Renderer ────────────────────────────────────────────────────
renderer = createWebGLArenaRenderer({
  canvas, overlayCanvas, cam, grid, bounds, decorations, fx, world, SEED, runtimeEvents,
  net: netClient, playerId,
  presentation,
  hud: {
    hud:         document.getElementById('hud'),
    hp:          document.getElementById('hud-hp'),
    mana:        document.getElementById('hud-mana'),
    meta:        document.getElementById('hud-meta'),
    readL:       document.getElementById('readout-left'),
    readR:       document.getElementById('readout-right'),
    zoomReadout: document.getElementById('zoom-readout'),
  },
  input: {
    leftStick:  inputRouter,
    rightStick: inputRouter,
    keyboardInput: () => {
      const o = inputRouter.getOutput();
      return { mx: o.intent.moveX, my: o.intent.moveY };
    },
  },
});

// ── Game loop (fixed tick + render) ─────────────────────────────
const ZOOM_MIN = 0.3, ZOOM_MAX = 6.0, ZOOM_STEP = 0.15;
let netTick = 0;

const loop = createFixedTickLoop({
  tickHz: SIM_TICK_HZ,
  simulate(dt) {
    // Sample input ONCE per tick — systems read via getOutput()
    const o = inputRouter.sample();
    if (o.zoomDelta) {
      cam.targetScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, cam.targetScale + o.zoomDelta * ZOOM_STEP));
    }
    if (isNetworked) {
      const snapshot = netClient.getLatestSnapshot();
      if (snapshot && interpolation.applySnapshot(snapshot)) localPrediction.reconcile();
      localPrediction.step(o, dt);
    } else {
      sim.setPlayerInput('local', samplePlayerCommand(o, ++netTick));
      sim.step(dt);
    }
    cameraSystem(world, dt);
    projectileFx.step(dt);
    if (isNetworked) netClient.update(++netTick, o);
  },
  render() {
    renderer.renderFrame();
    // Sync spell bar UI with active spell
    if (world.has(playerId, Spellbook)) {
      const sb = world.get(playerId, Spellbook);
      spellBar.querySelectorAll('.spell-btn').forEach((b, i) => {
        b.classList.toggle('active', i === sb.activeIndex);
        const charging = sb.charging && i === sb.chargeSpellIndex;
        b.classList.toggle('charging', charging);
        const spell = spellCatalog[sb.spells[i]];
        b.style.setProperty('--charge', charging ? Math.min(1, sb.charge / (spell?.chargeTime || 1)) : 0);
      });
    }
  },
});

loop.start();
console.log(`Cave: seed=${SEED.toString(16)} grid=${grid.cols}x${grid.rows} spawns=${spawns.length}`);

addEventListener('beforeunload', () => {
  loop.stop();
  inputRouter.destroy();
  netClient.destroy();
  renderer.dispose();
});
</script>
</body>
</html>
