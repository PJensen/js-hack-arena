<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Editor · Hack Arena</title>
  <style>
    :root { color-scheme:dark; font:14px/1.4 system-ui,sans-serif; background:#111615; color:#e9eee9; --accent:#a8dfb5; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header, .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px clamp(10px,3vw,26px); border-bottom:1px solid #323d36; }
    header { background:#202822; }
    h1 { margin:0 auto 0 0; font-size:17px; }
    button, input, select { font:inherit; color:inherit; }
    button, input:not([type=range]), select { padding:7px 10px; border:1px solid #48574c; border-radius:5px; background:#171e19; }
    button { cursor:pointer; }
    button:hover:not(:disabled) { background:#2c3930; }
    button:disabled { opacity:.45; cursor:default; }
    button[aria-pressed=true], #save:not(:disabled) { border-color:var(--accent); color:var(--accent); background:#263b2d; }
    #name, #savedLayouts { width:min(175px,42vw); }
    .toolbar { background:#191f1b; }
    .brushes { display:flex; flex-wrap:wrap; gap:5px; }
    .size { display:inline-flex; align-items:center; gap:6px; }
    #brushSize { width:92px; accent-color:var(--accent); }
    #sizeLabel { min-width:4ch; color:#a9b7ad; }
    main { display:grid; justify-items:center; gap:8px; padding:10px; }
    #map { --aspect:1; display:block; width:min(100%, max(280px, (100dvh - 155px) * var(--aspect))); aspect-ratio:var(--aspect); border:1px solid #415044; background:#1b231e; touch-action:none; cursor:crosshair; }
    #status { margin:0; min-height:1.4em; color:#bac7bd; text-align:center; }
    @media(max-width:650px) { h1 { width:100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Dungeon Editor</h1>
    <input id="name" aria-label="Dungeon name" placeholder="Dungeon name" maxlength="80">
    <button id="new" type="button">New</button>
    <button id="save" type="button">Save</button>
    <select id="savedLayouts" aria-label="Saved dungeons"><option value="">Saved dungeons</option></select>
    <button id="load" type="button" disabled>Load</button>
  </header>
  <div class="toolbar" aria-label="Drawing tools">
    <div class="brushes" role="group" aria-label="Brushes">
      <button type="button" data-brush="path" aria-pressed="true">Freehand</button>
      <button type="button" data-brush="erase" aria-pressed="false">Eraser</button>
      <button type="button" data-brush="circle" aria-pressed="false">Circle</button>
      <button type="button" data-brush="corridor" aria-pressed="false">Corridor</button>
      <button type="button" data-brush="rect" aria-pressed="false">Rectangle</button>
      <button type="button" data-brush="ellipse" aria-pressed="false">Oval</button>
    </div>
    <label class="size" for="brushSize">Size <input id="brushSize" type="range" min="80" max="2000" step="20" value="480"><output id="sizeLabel" for="brushSize">480</output></label>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="redo" type="button" disabled>Redo</button>
  </div>
  <main>
    <canvas id="map" aria-label="Dungeon drawing canvas"></canvas>
    <p id="status" role="status">Drag on the canvas to carve a dungeon.</p>
  </main>
  <script type="module" src="./editor.js"></script>
</body>
</html>
