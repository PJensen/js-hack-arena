<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Editor · Hack Arena</title>
  <style>
    :root { color-scheme:dark; font:14px/1.4 system-ui,sans-serif; background:#111615; color:#e9eee9; --accent:#a8dfb5; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header, .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px clamp(10px,3vw,26px); border-bottom:1px solid #323d36; }
    header { background:#202822; }
    h1 { margin:0 auto 0 0; font-size:17px; }
    button, input, select { font:inherit; color:inherit; }
    button, input:not([type=range]), select { padding:7px 10px; border:1px solid #48574c; border-radius:5px; background:#171e19; }
    button { cursor:pointer; }
    button:hover:not(:disabled) { background:#2c3930; }
    button:disabled { opacity:.45; cursor:default; }
    button[aria-pressed=true], #save:not(:disabled) { border-color:var(--accent); color:var(--accent); background:#263b2d; }
    #buildRock[aria-pressed=true], button[data-brush=erase][aria-pressed=true] { border-color:#eeb394; color:#ffd5bf; background:#432f28; }
    #name, #savedLayouts { width:min(175px,42vw); }
    .toolbar { background:#191f1b; }
    .brushes { display:flex; flex-wrap:wrap; gap:5px; }
    .size { display:inline-flex; align-items:center; gap:6px; }
    #brushSize { width:92px; accent-color:var(--accent); }
    #sizeLabel { min-width:4ch; color:#a9b7ad; }
    #roughness { width:85px; accent-color:var(--accent); }
    #roughnessLabel, #zoomLevel { min-width:4ch; color:#a9b7ad; }
    .view-tools { display:flex; align-items:center; flex-wrap:wrap; gap:5px; }
    .view-tools label { display:inline-flex; align-items:center; gap:4px; }
    #fitStatus { color:#c5d2c8; min-height:1.4em; text-align:center; }
    #placements { padding:8px clamp(10px,3vw,26px); border-bottom:1px solid #323d36; }
    #placements summary { cursor:pointer; color:var(--accent); }
    .placement-controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:7px; }
    .placement-controls label { display:inline-flex; align-items:center; gap:4px; }
    .placement-controls label[hidden] { display:none; }
    .placement-controls input[type=number] { width:78px; }
    main { display:grid; justify-items:center; gap:8px; padding:10px; }
    #map { --aspect:1; display:block; width:min(100%, max(280px, (100dvh - 155px) * var(--aspect))); aspect-ratio:var(--aspect); border:1px solid #415044; background:#1b231e; touch-action:none; cursor:crosshair; }
    #status { margin:0; min-height:1.4em; color:#bac7bd; text-align:center; }
    @media(max-width:650px) { h1 { width:100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Dungeon Editor</h1>
    <input id="name" aria-label="Dungeon name" placeholder="Dungeon name" maxlength="80">
    <button id="new" type="button">New</button>
    <button id="save" type="button">Save</button>
    <button id="playtest" type="button">Playtest</button>
    <select id="savedLayouts" aria-label="Saved dungeons"><option value="">Saved dungeons</option></select>
    <button id="load" type="button" disabled>Load</button>
  </header>
  <div class="toolbar" aria-label="Drawing tools">
    <div class="brushes" role="group" aria-label="Brush mode">
      <button id="carveFloor" type="button" aria-pressed="true">Carve floor</button>
      <button id="buildRock" type="button" aria-pressed="false">Build rock</button>
    </div>
    <div class="brushes" role="group" aria-label="Brushes">
      <button type="button" data-brush="path" aria-pressed="true">Freehand</button>
      <button type="button" data-brush="erase" aria-pressed="false">Eraser</button>
      <button type="button" data-brush="circle" aria-pressed="false">Circle</button>
      <button type="button" data-brush="corridor" aria-pressed="false">Corridor</button>
      <button type="button" data-brush="rect" aria-pressed="false">Rectangle</button>
      <button type="button" data-brush="ellipse" aria-pressed="false">Oval</button>
      <button type="button" data-brush="fit" aria-pressed="false">Player Fit</button>
      <button type="button" data-brush="start" aria-pressed="false">Set Start</button>
      <button type="button" data-brush="place" aria-pressed="false">Place Content</button>
      <button id="clearStart" type="button" disabled>Clear Start</button>
    </div>
    <label class="size" for="brushSize">Width <input id="brushSize" type="range" min="16" max="2000" step="4" value="480"><output id="sizeLabel" for="brushSize">480</output></label>
    <label class="size" for="roughness" title="Applies to all walls in this dungeon">Wall roughness <input id="roughness" type="range" min="0" max="100" value="0"><output id="roughnessLabel" for="roughness">0%</output></label>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="redo" type="button" disabled>Redo</button>
    <div class="view-tools" role="group" aria-label="Map view">
      <button type="button" data-brush="pan" aria-pressed="false">Pan</button>
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <output id="zoomLevel">1×</output>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="resetView" type="button">Fit Map</button>
      <label><input id="showGrid" type="checkbox">Grid</label>
      <label><input id="snapGrid" type="checkbox">Snap</label>
      <select id="gridSize" aria-label="Grid spacing">
        <option value="32">32 units</option>
        <option value="64">64 units</option>
        <option value="128" selected>128 units</option>
        <option value="256">256 units</option>
      </select>
    </div>
  </div>
  <details id="placements">
    <summary>Placements</summary>
    <div class="placement-controls">
      <select id="placementKind" aria-label="Placement type"></select>
      <select id="placementVariant" aria-label="Placement choice"></select>
      <label id="placementItemField" hidden>Item <select id="placementItem"></select></label>
      <label id="placementMimicField" hidden><input id="placementMimic" type="checkbox">Allow mimic</label>
      <label id="placementRadiusField" hidden>Radius <input id="placementRadius" type="number" min="32" max="1200" step="1" value="160"></label>
      <label id="placementCountField" hidden>Count <input id="placementCount" type="number" min="1" max="12" value="3"></label>
      <select id="placementAction" aria-label="Canvas placement action">
        <option value="add">Add on map</option>
        <option value="move">Move selected on map</option>
        <option value="patrol">Add patrol waypoint</option>
      </select>
    </div>
    <div class="placement-controls">
      <select id="placedMarkers" aria-label="Placed markers"><option value="">Select a placed marker</option></select>
      <button id="updateMarker" type="button" disabled>Apply Settings</button>
      <button id="clearPatrol" type="button" disabled>Clear Patrol</button>
      <button id="removeMarker" type="button" disabled>Remove Marker</button>
    </div>
  </details>
  <main>
    <canvas id="map" aria-label="Dungeon drawing canvas"></canvas>
    <div id="fitStatus"></div>
    <p id="status" role="status">Drag on the canvas to carve a dungeon.</p>
  </main>
  <script type="module" src="./editor.js"></script>
</body>
</html>
